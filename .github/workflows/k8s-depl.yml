name: deploy-image

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: k8s-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/curmens/orc-ghana-card

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set-tag.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Docker tag
        id: set-tag
        run: |
          echo "image_tag=v1-${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.set-tag.outputs.image_tag }}
            ${{ env.IMAGE_NAME }}:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Kubernetes via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USERNAME }}
          key: ${{ secrets.SSH_PROD_KEY }}
          script: |
            set -e

            IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}

            echo "Setting image to: ghcr.io/curmens/orc-ghana-card:${IMAGE_TAG}"

            sudo kubectl version --client

            # Update the deployment image
            sudo kubectl set image deployment/ocr ocr=ghcr.io/curmens/orc-ghana-card:$IMAGE_TAG -n mechlog

            # Wait for rollout with timeout
            sudo kubectl rollout status deployment/ocr -n mechlog --timeout=600s

            # Verify deployment
            sudo kubectl get pods -n mechlog -l app=ocr

            echo "Deployment succeeded"
